# Every push to main/master builds a separate public demo (the demo Pages alias).
# Full-game production Pages and the native "latest" release keep their existing automatic publishing.
# The parallel demo reuses the existing Cloudflare repository secrets.
# Also runs by hand from the Actions tab ("Run workflow"). The quick checks (tools/run_tests.sh quick) run first; if
# they fail, nothing is published.
name: Windows, Android and Web build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

# a newer push replaces a build still running
concurrency:
  group: windows-build
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.8"
  GODOT_RELEASE: "beta3"

jobs:
  windows:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Java, for signing the Android build (the runner already has the Android SDK)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Godot and its Windows and Android export templates, downloaded once and kept between runs
      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}-windows-android-web

      - name: Download Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}"
          templates=~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}
          mkdir -p ~/godot "$templates"
          curl -fsSL -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v*_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot
          curl -fsSL -o /tmp/templates.tpz "$base/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/tpz
          cp /tmp/tpz/templates/version.txt /tmp/tpz/templates/windows_* /tmp/tpz/templates/android_*.apk /tmp/tpz/templates/web_nothreads_*.zip "$templates/"
          ls "$templates"

      # imports the project's assets (first run in a fresh checkout), then the quick checks
      - name: Import and check
        run: |
          ~/godot/godot --headless --path . --import
          GODOT=~/godot/godot bash tools/run_tests.sh quick

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build Web
        run: |
          python -m pip install Pillow==11.3.0
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          GODOT=~/godot/godot python tools/make_web.py
          node --test tools/tests/web_fullscreen.test.cjs

      - name: Keep Web package
        uses: actions/upload-artifact@v4
        with:
          name: RubyCocoon-web
          path: build/web/
          if-no-files-found: error

      - name: Export for Windows
        run: |
          mkdir -p build/windows
          ~/godot/godot --headless --path . --export-release "Windows Desktop" build/windows/RubyCocoon.exe
          test -s build/windows/RubyCocoon.exe
          cd build/windows && zip -q -9 ../RubyCocoon-windows.zip RubyCocoon.exe
          ls -la ../RubyCocoon-windows.zip

      # the phone app "Ruby Cocoon" (com.rubycocoon.x, so it installs beside the original voxel app), signed with
      # the keystore in the ANDROID_KEYSTORE_BASE64 secret (Godot's debug keystore from the computer that builds the
      # phone copies, so a download updates the app already installed). Without that secret, only Windows is published.
      - name: Export for Android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret, so no Android build"
            exit 0
          fi
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.1.0"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/android.keystore"
          mkdir -p ~/.config/godot build/android
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\n%s\n%s\n' \
            "export/android/android_sdk_path = \"$ANDROID_HOME\"" "export/android/java_sdk_path = \"$JAVA_HOME\"" \
            > ~/.config/godot/editor_settings-${GODOT_VERSION}.tres
          sed -i -e '/^\[preset.0.options\]/,/^\[preset.1\]/{s/^package\/unique_name=.*/package\/unique_name="com.rubycocoon.x"/;s/^package\/name=.*/package\/name="Ruby Cocoon"/}' \
            export_presets.cfg
          # (a debug keystore's alias and password are always these)
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$RUNNER_TEMP/android.keystore" \
            GODOT_ANDROID_KEYSTORE_RELEASE_USER=androiddebugkey GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=android \
            ~/godot/godot --headless --path . --export-release "Android" build/android/RubyCocoon-android.apk
          test -s build/android/RubyCocoon-android.apk
          ls -la build/android/RubyCocoon-android.apk

      # the "latest" release always holds the newest build (the one before is replaced)
      - name: Publish as the latest build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=(build/RubyCocoon-windows.zip)
          [ -s build/android/RubyCocoon-android.apk ] && files+=(build/android/RubyCocoon-android.apk)
          notes="Built from ${GITHUB_SHA::7}: $(git log -1 --format=%s)"
          gh release delete latest --yes --cleanup-tag || true
          # (a full release, marked latest: GitHub's sidebar doesn't show pre-releases)
          gh release create latest "${files[@]}" --target "$GITHUB_SHA" --latest \
            --title "Latest build" --notes "$notes"

      - name: Check Cloudflare credentials
        id: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to deploy Web. The Web artifact is available for download."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy Web to Cloudflare Pages
        if: steps.cloudflare.outputs.ready == 'true' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/web --project-name=rubycoccon --branch=main

  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}-windows-android-web
      - name: Download Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}"
          templates=~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}
          mkdir -p ~/godot "$templates"
          curl -fsSL -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v*_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot
          curl -fsSL -o /tmp/templates.tpz "$base/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/tpz
          cp /tmp/tpz/templates/version.txt /tmp/tpz/templates/windows_* /tmp/tpz/templates/android_*.apk /tmp/tpz/templates/web_nothreads_*.zip "$templates/"
      - name: Import and check demo progression
        run: |
          ~/godot/godot --headless --path . --import
          GODOT=~/godot/godot bash tools/run_tests.sh quick
          GODOT=~/godot/godot bash tools/run_tests.sh demo demo-touch
      - name: Build Web demo
        run: |
          python -m pip install Pillow==11.3.0
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          GODOT=~/godot/godot python tools/make_web.py --demo
          node --test tools/tests/web_fullscreen.test.cjs
      - name: Keep Web demo package
        uses: actions/upload-artifact@v4
        with:
          name: RubyCocoon-web-demo
          path: build/web_demo/
          if-no-files-found: error
      - name: Check Cloudflare credentials
        id: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Set the existing CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets to publish the demo."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy demo to Cloudflare Pages
        if: steps.cloudflare.outputs.ready == 'true' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/web_demo --project-name=rubycoccon --branch=demo
